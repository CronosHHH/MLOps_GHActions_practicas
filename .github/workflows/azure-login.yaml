name: Conexión Automática a Azure ML

on:
  push:
    branches:
      - prod  # Cambia esto por el nombre de tu rama si no estás usando main

permissions:
  id-token: write  # OBLIGATORIO: Permite usar las credenciales federadas (OIDC) sin contraseñas
  contents: read   # Permite a GitHub leer los archivos del repositorio

jobs:
  conectar-azure:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código del repositorio en la máquina virtual
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Inicia sesión en Azure usando tus 3 llaves de autenticación
      - name: Iniciar Sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Comprobación rápida para verificar que estás dentro de tu Workspace
      - name: Probar conexión a Azure ML
        run: |
          az extension add --name ml -y
          az ml workspace show --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --workspace-name ${{ secrets.AZURE_WORKSPACE_NAME }}