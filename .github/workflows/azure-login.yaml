name: Conexión Automática a Azure ML

on:
  push:
    branches:
      - prod

permissions:
  id-token: write  # Permite usar credenciales federadas (OIDC)
  contents: read   # Permite leer los archivos del repositorio

jobs:
  conectar-azure:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código del repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Inicia sesión en Azure con OIDC
      - name: Iniciar Sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Comprobación de conexión al Workspace
      - name: Probar conexión a Azure ML
        run: |
          az extension add --name ml -y
          az ml workspace show --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name ${{ secrets.AZURE_WORKSPACE_NAME }}