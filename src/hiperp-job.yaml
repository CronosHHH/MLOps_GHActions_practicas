$schema: https://azuremlschemas.azureedge.net/latest/sweepJob.schema.json
type: sweep

objective:
  primary_metric: mean_squared_error
  goal: minimize

sampling_algorithm: random

search_space:
  n_estimators:
    type: choice
    values: [50, 100, 200, 300]
  max_depth:
    type: choice
    values: [3, 5, 8, 10, 15]

limits:
  max_total_trials: 12
  max_concurrent_trials: 2
  max_duration: 30

early_termination:
  type: bandit
  slack_factor: 0.1
  evaluation_interval: 1

trial:
  code: .
  command: python train.py --data ${{inputs.training_data}} --n_estimators ${{search_space.n_estimators}} --max_depth ${{search_space.max_depth}}
  environment: azureml:Mi_docker-Img:4

compute: azureml:cpu-cluster       # ← MOVIDO fuera de trial, a nivel raíz

inputs:
  training_data:
    type: mltable
    path: azureml:diabetes-dataset:1

display_name: diabetes-sweep-rf
experiment_name: diabetes-experiment-con-hiperparametros