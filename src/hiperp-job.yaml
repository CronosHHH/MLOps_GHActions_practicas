$schema: https://azuremlschemas.azureedge.net/latest/sweepJob.schema.json
type: sweep

# 1. Definir el objetivo a optimizar
objective:
  primary_metric: mean_squared_error # alternativa: accuracy, f1_score, etc.
  goal: minimize

# 2. Método de muestreo
sampling_algorithm: random

# 3. Espacio de búsqueda de hiperparámetros
search_space:
  n_estimators:
    type: choice
    values: [50, 100, 200, 300]
  max_depth:
    type: choice
    values: [3, 5, 8, 10, 15]

# 4. Límites de ejecución y política de terminación
limits:
  max_total_trials: 12
  max_concurrent_trials: 2
  timeout_minutes: 30

early_termination:
  type: bandit
  slack_factor: 0.1
  evaluation_interval: 1

# 5. Plantilla del comando a ejecutar
trial:
  code: .
  command: python train.py --data ${{inputs.training_data}} --n_estimators ${{search_space.n_estimators}} --max_depth ${{search_space.max_depth}}
  environment: azureml:Mi_docker-Img:4
  compute: azureml:cpu-cluster

inputs:
  training_data:
    type: mltable
    path: azureml:diabetes-dataset:1

display_name: diabetes-sweep-rf
experiment_name: diabetes-experiment-con-hiperparametros